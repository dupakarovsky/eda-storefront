services:
    postgres:
        image: postgres:17
        container_name: eda-postgres
        restart: unless-stopped
        env_file:
            - ./.postgres.env
        # guarantees that the Postgres container has started and
        # has finished initializing (ready to accept connections)
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U edasuper -d edadb']
            interval: 5s
            timeout: 3s
            retries: 5
        ports:
            - 127.0.0.1:5433:5432
        volumes:
            # local pg-data dir bound to the containers posgresql/data
            - pg-data:/var/lib/postgresql/data
            - ./postgres/init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh
            - ./postgres/init/02-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh
            - ./postgres/init/03-stores-db.sh:/docker-entrypoint-initdb.d/03-stores-db.sh
            - ./postgres/init/04-baskets-db.sh:/docker-entrypoint-initdb.d/04-baskets-db.sh
            - ./postgres/init/05-depot-db.sh:/docker-entrypoint-initdb.d/05-depot-db.sh
            - ./postgres/init/06-ordering-db.sh:/docker-entrypoint-initdb.d/06-ordering-db.sh
            - ./postgres/config:/etc/postgresql/conf.d
        networks:
            - eda-net

    nats:
        image: nats:2.12
        container_name: eda-nats
        restart: unless-stopped
        # sets the JetStream store directory inside the container.
        # this has to match the volume's mount target : /data
        command: '--jetstream --http_port 8222 --store_dir /data'

        ports:
            - 127.0.0.1:4223:4222
            - 127.0.0.1:8222:8222
        volumes:
            - nats-data:/data
        networks:
            - eda-net

    stores:
        build:
            context: .
            dockerfile: stores/Dockerfile
        container_name: eda-stores
        restart: unless-stopped
        env_file:
            - ./stores/.env
        # override these values from env_file. These values will
        # be applied for the docker container (the .env files have
        # the values for the operating in the local environment)
        environment:
            DB_HOST: 'postgres'
            DB_PORT: '5432'
            NATS_URL: nats://nats:4222
            # overrides the foundationlogging default path so it doesn't
            # create a .log file. Instead,we realy on docker compose logs stores
            # for retriving this container's logs
            LOG_FILE_PATH: ''
        depends_on:
            postgres:
                condition: service_healthy
            nats:
                # just wait for the container process to launch, not for readiness
                condition: service_started
        ports:
            - 127.0.0.1:8080:8080
        networks:
            - eda-net

    baskets:
        build:
            context: .
            dockerfile: depot-baskets/baskets/Dockerfile
        container_name: eda-baskets
        restart: unless-stopped
        env_file:
            - ./depot-baskets/baskets/.env
        # override these values from .env. These values will
        # be applied for the docker container (the .env files have
        # the values for the operating in the local environment)
        environment:
            DB_HOST: 'postgres'
            DB_PORT: '5432'
            NATS_URL: nats://nats:4222
            LOG_FILE_PATH: ''
            SRV_PORT: '8080'
        depends_on:
            postgres:
                condition: service_healthy
            nats:
                condition: service_started
            stores:
                condition: service_started
        ports:
            - 127.0.0.1:8081:8080
        networks:
            - eda-net

    depot:
        build:
            context: .
            dockerfile: depot-baskets/depot/Dockerfile
        container_name: eda-depot
        restart: unless-stopped
        # override these values from .env. These values will
        # be applied for the docker container (the .env files have
        # the values for the operating in the local environment)
        env_file:
            - ./depot-baskets/depot/.env
        environment:
            DB_HOST: 'postgres'
            DB_PORT: '5432'
            NATS_URL: nats://nats:4222
            LOG_FILE_PATH: ''
            SRV_PORT: '8080'
        depends_on:
            postgres:
                condition: service_healthy
            nats:
                condition: service_started
            stores:
                condition: service_started
        ports:
            - 127.0.0.1:8082:8080
        networks:
            - eda-net

    ordering:
        build:
            context: .
            dockerfile: ./ordering/Dockerfile
        container_name: eda-ordering
        restart: unless-stopped
        # override these values from .env. These values will
        # be applied for the docker container (the .env files have
        # the values for the operating in the local environment)
        env_file:
            - ./ordering/.env
        environment:
            DB_HOST: 'postgres'
            DB_PORT: '5432'
            NATS_URL: nats://nats:4222
            LOG_FILE_PATH: ''
            SRV_PORT: '8080'
        depends_on:
            postgres:
                condition: service_healthy
            nats:
                condition: service_started
            stores:
                condition: service_started
            baskets:
                condition: service_started
            depot:
                condition: service_started
        ports:
            - 127.0.0.1:8083:8080
        networks:
            - eda-net

    # nats-box:
    #     image: natsio/nats-box:latest
    #     container_name: eda-nats-box
    #     restart: unless-stopped
    #     networks:
    #         - eda-net

volumes:
    pg-data:
    nats-data:

networks:
    eda-net:
        ipam:
            config:
                - subnet: 172.18.0.0/16
