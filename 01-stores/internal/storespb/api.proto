syntax = "proto3"; 

// buf convention is versioned packages
package "stores.v1"

// package name for code to import
option go_package = "github.com/dupakarovsky/eda-storefront/stores/storespb";

// === STORES MESSAGES ========================================================

message Store {
  string id = 1;
  string name = 2;
  string location = 3;
  bool participating = 4;
}

// message format from client to server when requesting the creation 
// of a store
message CreateStoreRequest {
  string name = 1;
  string location = 2; 
}

// message format from server to client responding when a Store is 
// created
message CreateStoreResponse {
  Store store = 1;
}

// message format from client to server when RebrandStore is invoked
message RebrandStoreRequest {
  string store_id = 1; // store to rebrand 
  string name = 2;  // new name
}

// message format from server to client when store as been rebranded
message RebrandStoreResponse {
  Store store = 1; // store id that was rebanded
}


// message format from client to server when EnableStoreParticipation 
// is invoked
message EnableStoreParticipationRequest {
  string store_id = 1;
}

// message format from client to server when DisableStoreParticipation 
// is invoked
message DisableStoreParticipationRequest {
  string store_id = 1;
}

// message format from server to client responding to DisableStoreParticipation
// request
message DisableStoreParticipationResponse {
  Store store = 1;
}


// === PRODUCTS MESSAGES ======================================================

message Product {
  string id = 1;
  string store_id = 2;
  string name = 3;
  string description = 4;
  string sku = 5;
  double price = 6;
}

// message format from client to server when AddProduct is invoked
message AddProductRequest {
  string store_id = 1;
  string name = 2;
  string description = 3;
  string sku = 4;
  double price = 5;
}

// message fromat from server to client responding to a AddProduct 
// request
message AddProductResponse {
  Product product = 1;
}

// message format from client to server when RebrandProductRequest is
// invoked
message RebrandProductRequest {
  string product_id = 1;
  string name = 2;
  string description = 3;
}


// message from server to client responding to RebrandProduct request
message RebrandProductResponse {
  Product product = 1;
}

// message format from client to server when IncreaseProductPrice is invoked
message IncreaseProductPriceRequest {
  string product_id = 1;
  double price = 2;
}

// message format from server to client when responsing to a IncreaseProductPrice 
// request
message IncreaseProductPriceResponse {
  Product product = 1;
}

// message format from client to server when DecreaseProductPrice is invoked
// request
message DecreaseProductPriceRequest {
  string product_id = 1;
  double price = 2;
}

// message format from server to client when responsing to a DeceaseProductPrice
// request
message DecreaseProductPriceResponse {
  Product product = 1;
}

// message format from client to server when invoking RemoveProduct
message RemoveProductRequest {
  string product_id = 1;
}

// message from server to client when responding to a RemoveProduct 
// request.
message RemoveProductResponse {}


// message format from client to server when invoking the GetStore method
message GetStoreRequest {
  string store_id = 1;
}

// message format from client to server when responding to GetStore
message GetStoreResponse {
  Store store = 1;
}

// message from client to server when requesti a listing of all products
message ListProductsRequest {
  string store_id = 1;
}

// message from server to client responding to a ListProducts request
message ListProductsResponse {
  repeated Product products = 1;
}


// === STORE SERVICE DEFINITION  ==============================================

service StoresService {
  rpc CreateStore(CreateStoreRequest) returns (CreateStoreResponse);
  rpc RebrandStore(RebrandStoreRequest) returns (RebrandStoreResponse);
  rpc EnableStoreParticipation(EnableStoreParticipationRequest) returns (EnableStoreParticipationResponse);
  rpc DisableStoreParticipation(DisableStoreParticipationRequest) returns (DisableStoreParticipationResponse);
  rpc AddProduct(AddProductRequest) returns (AddProductResponse);
  rpc RebrandProduct(RebrandProductRequest) returns (RebrandProductResponse);
  rpc IncreaseProductPrice(IncreaseProductPriceRequest) returns (IncreaseProductPriceResponse);
  rpc DecreaseProductPrice(DecreaseProductPriceRequest) returns (DecreaseProductPriceResponse);
  rpc RemoveProduct(RemoveProductRequest) returns (RemoveProductResponse);
  rpc GetStore(GetStoreRequest) returns (GetStoreResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
}

